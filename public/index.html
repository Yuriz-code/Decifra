<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2EEFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#130F2E" media="(prefers-color-scheme: dark)" />
    <meta name="application-name" content="Decifra" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Decifra" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Decifra! Jogo de palavras secretas</title>
    <link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Fontes hospedadas no próprio servidor (Fredoka e Nunito, licença OFL em fonts/LICENSE-OFL.txt): sem depender do Google */
      @font-face {
        font-family: 'Fredoka';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url(fonts/fredoka-latin.woff2) format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F,
          U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-weight: 200 1000;
        font-display: swap;
        src: url(fonts/nunito-latin.woff2) format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F,
          U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      :root {
        --bg: #f2eeff;
        --surface: #ffffff;
        --ink: #1d1745;
        --muted: #6b6492;
        --line: #dad3f5;
        --dot: #e0d9f8;
        --grape: #6a3df0;
        --tang: #ff6b2c;
        --teal: #0a9e8e;
        --sun: #ffc93c;
        --rose: #ef476f;
        --tile: #ffffff;
        --tile-edge: #c9bef2;
        --good: #12934a;
        --bad: #e11d48;
        --shade: rgba(29, 23, 69, 0.28);
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #130f2e;
          --surface: #1f1950;
          --ink: #f4f1ff;
          --muted: #a9a2d8;
          --line: #372d80;
          --dot: #1b1540;
          --tile: #2d2470;
          --tile-edge: #17113f;
          --grape: #8b66ff;
          --teal: #19c9b5;
          --good: #35d07f;
          --bad: #ff5d7e;
          --shade: rgba(0, 0, 0, 0.5);
        }
      }
      :root[data-theme='dark'] {
        --bg: #130f2e;
        --surface: #1f1950;
        --ink: #f4f1ff;
        --muted: #a9a2d8;
        --line: #372d80;
        --dot: #1b1540;
        --tile: #2d2470;
        --tile-edge: #17113f;
        --grape: #8b66ff;
        --teal: #19c9b5;
        --good: #35d07f;
        --bad: #ff5d7e;
        --shade: rgba(0, 0, 0, 0.5);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font:
          600 16px/1.45 'Nunito',
          system-ui,
          sans-serif;
        background-image: radial-gradient(var(--dot) 1.6px, transparent 1.6px);
        background-size: 28px 28px;
        -webkit-font-smoothing: antialiased;
      }
      h1,
      h2,
      h3,
      .disp {
        font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
        font-weight: 600;
        margin: 0;
        letter-spacing: 0.01em;
      }
      h2 {
        font-size: 30px;
      }
      h3 {
        font-size: 20px;
        margin-bottom: 10px;
      }
      p {
        margin: 0.3em 0;
      }
      .mut {
        color: var(--muted);
      }
      .wrap {
        max-width: 1020px;
        margin: 0 auto;
        padding: 16px 16px 40px;
      }
      .narrow {
        max-width: 640px;
      }
      button {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 3px solid var(--sun);
        outline-offset: 2px;
      }
      .btn {
        font:
          600 19px 'Fredoka',
          sans-serif;
        min-height: 50px;
        padding: 12px 24px;
        border: 0;
        border-radius: 16px;
        background: var(--grape);
        color: #fff;
        box-shadow: 0 5px 0 var(--shade);
        cursor: pointer;
        transition:
          transform 0.08s,
          box-shadow 0.08s;
      }
      .btn:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 var(--shade);
      }
      .btn.tang {
        background: var(--tang);
      }
      .btn.teal {
        background: var(--teal);
      }
      .btn.rose {
        background: var(--rose);
      }
      .btn.sun {
        background: var(--sun);
        color: #2a2000;
      }
      .btn.ghost,
      .ghost {
        background: var(--surface);
        color: var(--ink);
        border: 2px solid var(--line);
        box-shadow: 0 4px 0 var(--line);
      }
      button.ghost {
        border-radius: 14px;
        padding: 8px 14px;
        cursor: pointer;
        min-height: 42px;
        font-weight: 700;
      }
      .btn.big {
        width: 100%;
        font-size: 22px;
        min-height: 58px;
      }
      .btn.sm {
        font-size: 16px;
        min-height: 42px;
        padding: 8px 16px;
        border-radius: 12px;
      }
      .btn[disabled] {
        opacity: 0.45;
        pointer-events: none;
      }
      .card {
        background: var(--surface);
        border: 2px solid var(--line);
        border-radius: 22px;
        padding: 18px;
        margin: 14px 0;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border-radius: 99px;
        background: var(--surface);
        border: 2px solid var(--line);
        font-weight: 800;
        font-size: 14px;
        cursor: default;
      }
      button.chip {
        cursor: pointer;
        font-family: inherit;
        color: var(--ink);
      }
      button.chip.on {
        background: var(--grape);
        border-color: var(--grape);
        color: #fff;
      }
      .chip.cat {
        background: var(--sun);
        border-color: var(--sun);
        color: #2a2000;
      }
      .back {
        margin-bottom: 8px;
      }
      /* tiles */
      .word {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px 26px;
        --ts: min(54px, calc((min(100vw, 700px) - 64px) / var(--n)));
        margin: 14px 0;
      }
      .wd {
        display: flex;
        gap: calc(var(--ts) * 0.1);
      }
      .tile {
        width: var(--ts);
        height: calc(var(--ts) * 1.2);
        display: grid;
        place-items: center;
        border-radius: calc(var(--ts) * 0.22);
        font:
          700 calc(var(--ts) * 0.66) 'Fredoka',
          sans-serif;
        background: var(--tile);
        box-shadow: 0 5px 0 var(--tile-edge);
        color: var(--ink);
      }
      .tile.blank {
        background: transparent;
        box-shadow: inset 0 -5px 0 var(--tile-edge);
        border-radius: 6px;
      }
      .tile.on {
        background: var(--sun);
        color: #2a2000;
        box-shadow: 0 5px 0 #c99a00;
      }
      .tile.flip {
        animation: flip 0.55s cubic-bezier(0.3, 1.4, 0.5, 1) both;
        animation-delay: calc(var(--i) * 70ms);
      }
      .sep {
        align-self: center;
        font: 700 calc(var(--ts) * 0.6) 'Fredoka';
        color: var(--muted);
      }
      @keyframes flip {
        from {
          transform: rotateX(95deg) scale(0.7);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      /* hero */
      .hero {
        text-align: center;
        padding: 30px 0 10px;
      }
      .hero .word {
        --ts: min(64px, calc((100vw - 56px) / 7.6));
        gap: 0;
      }
      .hero .wd {
        gap: calc(var(--ts) * 0.14);
      }
      .hero .tile:nth-child(3n + 1) {
        background: var(--tang);
        color: #fff;
        box-shadow: 0 5px 0 #b93f0b;
      }
      .hero .tile:nth-child(3n + 2) {
        background: var(--grape);
        color: #fff;
        box-shadow: 0 5px 0 #3b1ca8;
      }
      .hero .tile:nth-child(3n) {
        background: var(--teal);
        color: #fff;
        box-shadow: 0 5px 0 #06695f;
      }
      .hero .tile {
        animation: flip 0.6s cubic-bezier(0.3, 1.4, 0.5, 1) both;
        animation-delay: calc(var(--i) * 110ms + 100ms);
      }
      .hero p {
        font-size: 19px;
        max-width: 420px;
        margin: 14px auto 0;
      }
      .menu {
        display: grid;
        gap: 14px;
        max-width: 460px;
        margin: 26px auto 0;
      }
      .menu .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      /* inputs */
      input[type='text'],
      input:not([type]) {
        font:
          700 18px 'Nunito',
          sans-serif;
        width: 100%;
        min-height: 50px;
        padding: 10px 16px;
        border-radius: 14px;
        border: 2px solid var(--line);
        background: var(--bg);
        color: var(--ink);
      }
      input:focus {
        border-color: var(--grape);
        outline: none;
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--grape) 30%, transparent);
      }
      .code-in {
        text-align: center;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        font:
          600 30px 'Fredoka',
          sans-serif;
      }
      .prow {
        display: flex;
        gap: 10px;
        align-items: center;
        margin: 8px 0;
      }
      .avb,
      .av {
        display: inline-grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--c, var(--grape));
        font-size: 24px;
        flex: none;
        border: 0;
        box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18);
      }
      .avb {
        cursor: pointer;
      }
      .av.sm {
        width: 34px;
        height: 34px;
        font-size: 19px;
      }
      .av.lg {
        width: 96px;
        height: 96px;
        font-size: 54px;
      }
      .x {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        border: 2px solid var(--line);
        background: var(--surface);
        cursor: pointer;
        color: var(--muted);
      }
      .team {
        min-width: 92px;
        border: 0;
        border-radius: 12px;
        min-height: 44px;
        font: 600 15px 'Fredoka';
        cursor: pointer;
        color: #fff;
      }
      .team.t0 {
        background: var(--tang);
      }
      .team.t1 {
        background: var(--teal);
      }
      .avgrid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 8px;
      }
      .avgrid button {
        aspect-ratio: 1;
        border-radius: 14px;
        border: 3px solid transparent;
        background: var(--bg);
        font-size: 26px;
        cursor: pointer;
      }
      .avgrid button.on {
        border-color: var(--grape);
        background: var(--surface);
      }
      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 12px 0;
      }
      /* game */
      .gtop {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .gm {
        display: grid;
        gap: 16px;
        grid-template-columns: minmax(0, 1fr);
      }
      @media (min-width: 880px) {
        .gm {
          grid-template-columns: minmax(0, 1fr) 310px;
        }
      }
      .timer {
        text-align: center;
      }
      .tm {
        font:
          700 clamp(64px, 14vw, 112px)/1 'Fredoka',
          sans-serif;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }
      .tm.low {
        color: var(--bad);
        animation: pulse 0.5s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        to {
          transform: scale(1.1);
        }
      }
      .tbar {
        height: 14px;
        border-radius: 99px;
        background: var(--line);
        overflow: hidden;
        max-width: 520px;
        margin: 6px auto 0;
      }
      .tbar i {
        display: block;
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, var(--teal), var(--sun), var(--tang));
        transition: width 0.15s linear;
      }
      .stage {
        text-align: center;
      }
      .clues {
        list-style: none;
        margin: 10px 0 0;
        padding: 0;
        display: grid;
        gap: 8px;
        text-align: left;
      }
      .clues li {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        background: var(--bg);
        border-radius: 14px;
        padding: 10px 14px;
        animation: pop 0.35s both;
      }
      .clues li b {
        flex: none;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--grape);
        color: #fff;
        display: grid;
        place-items: center;
        font: 600 14px 'Fredoka';
      }
      .clues li.q {
        opacity: 0.6;
        border: 2px dashed var(--line);
        background: transparent;
      }
      @keyframes pop {
        from {
          transform: scale(0.85);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      .feed {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 220px;
        overflow: auto;
      }
      .g {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 12px;
        background: var(--bg);
      }
      .g.no span.x1 {
        text-decoration: line-through;
        opacity: 0.7;
      }
      .g.near {
        background: color-mix(in srgb, var(--sun) 35%, transparent);
      }
      .g.ok {
        background: color-mix(in srgb, var(--good) 28%, transparent);
      }
      .gform {
        display: flex;
        gap: 10px;
      }
      .gform input {
        flex: 1;
      }
      .shake {
        animation: shake 0.4s;
      }
      @keyframes shake {
        20%,
        60% {
          transform: translateX(-9px);
        }
        40%,
        80% {
          transform: translateX(9px);
        }
      }
      .board {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 8px;
      }
      .board li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 16px;
        background: var(--bg);
        position: relative;
        transition: transform 0.3s;
      }
      .board li.me {
        outline: 3px solid var(--grape);
      }
      .board li.turn {
        background: var(--sun);
        color: #2a2000;
        animation: pop 0.4s;
      }
      .board .rk {
        width: 22px;
        text-align: center;
        font: 600 16px 'Fredoka';
        color: var(--muted);
      }
      .board .nm {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 800;
      }
      .board .sc {
        font: 700 20px 'Fredoka';
        font-variant-numeric: tabular-nums;
      }
      .board .pt {
        position: absolute;
        right: 10px;
        top: -10px;
        background: var(--good);
        color: #fff;
        border-radius: 99px;
        padding: 2px 10px;
        font: 600 15px 'Fredoka';
        animation: rise 2.2s both;
      }
      @keyframes rise {
        0% {
          transform: translateY(14px);
          opacity: 0;
        }
        15% {
          opacity: 1;
          transform: none;
        }
        80% {
          opacity: 1;
        }
        100% {
          transform: translateY(-14px);
          opacity: 0;
        }
      }
      .teamhead {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 10px;
      }
      .teamhead div {
        border-radius: 14px;
        padding: 8px;
        text-align: center;
        color: #fff;
        font: 600 18px 'Fredoka';
      }
      .teamhead .t0 {
        background: var(--tang);
      }
      .teamhead .t1 {
        background: var(--teal);
      }
      .big-msg {
        text-align: center;
        padding: 20px 8px;
      }
      .bounce {
        animation: bounce 0.7s ease-in-out infinite alternate;
      }
      @keyframes bounce {
        to {
          transform: translateY(-12px);
        }
      }
      .codebox {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin: 10px 0;
      }
      .codebox .tile {
        --ts: 54px;
        background: var(--grape);
        color: #fff;
        box-shadow: 0 5px 0 #3b1ca8;
      }
      .sug {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 8px 0;
      }
      .sug button {
        border: 2px dashed var(--line);
        background: transparent;
        border-radius: 12px;
        padding: 6px 10px;
        cursor: pointer;
        font-size: 14px;
        text-align: left;
      }
      .emo {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 6px 0;
      }
      .emo button {
        border: 0;
        background: var(--bg);
        border-radius: 10px;
        width: 40px;
        height: 40px;
        font-size: 22px;
        cursor: pointer;
      }
      .res {
        display: grid;
        gap: 8px;
        margin: 10px 0;
      }
      .res .it {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--bg);
        border-radius: 14px;
        padding: 8px 12px;
      }
      .res .it b {
        margin-left: auto;
        color: var(--good);
        font: 700 20px 'Fredoka';
      }
      .podium {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        align-items: end;
        margin: 20px 0;
      }
      .podium .pc {
        text-align: center;
      }
      .podium .step {
        border-radius: 16px 16px 0 0;
        display: grid;
        place-items: start center;
        padding-top: 10px;
        font: 700 34px 'Fredoka';
        color: #fff;
      }
      .pc.p1 .step {
        height: 150px;
        background: var(--tang);
      }
      .pc.p2 .step {
        height: 110px;
        background: var(--grape);
      }
      .pc.p3 .step {
        height: 80px;
        background: var(--teal);
      }
      .podium .nm {
        font-weight: 800;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .trophy {
        font-size: 64px;
        animation: bounce 0.8s ease-in-out infinite alternate;
      }
      .hl {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 10px;
      }
      .hl div {
        background: var(--bg);
        border-radius: 16px;
        padding: 12px;
        text-align: center;
      }
      .hl big {
        display: block;
        font: 700 26px 'Fredoka';
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 8px 6px;
        text-align: center;
      }
      th:nth-child(2),
      td:nth-child(2) {
        text-align: left;
      }
      tr + tr td {
        border-top: 2px solid var(--line);
      }
      .sw {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      /* letras */
      .kb {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
        margin: 10px 0;
      }
      .kb button {
        min-height: 42px;
        border-radius: 10px;
        border: 0;
        background: var(--bg);
        font:
          600 18px 'Fredoka',
          sans-serif;
        cursor: pointer;
        color: var(--ink);
        box-shadow: 0 3px 0 var(--line);
      }
      .kb button.found {
        background: var(--good);
        color: #fff;
      }
      .kb button.absent {
        background: var(--line);
        opacity: 0.5;
      }
      .kb button:disabled {
        cursor: default;
      }
      /* visual v2 */
      body {
        background-image:

  <body>
    <div id="app"></div>
    <div id="fx" aria-hidden="true"></div>
    <div id="toasts" aria-live="polite"></div>
    <script>
      /* OPCIONAL: servidores de conexão próprios (melhora a conexão em redes de empresa).
   Exemplo com TURN gratuito do metered.ca (crie uma conta grátis e copie suas credenciais):
   window.DECIFRA_ICE=[{urls:'stun:stun.relay.metered.ca:80'},{urls:'turn:global.relay.metered.ca:443',username:'SEU_USUARIO',credential:'SUA_SENHA'},{urls:'turns:global.relay.metered.ca:443?transport=tcp',username:'SEU_USUARIO',credential:'SUA_SENHA'}];
   Deixe vazio para usar os servidores públicos padrão. */
      window.DECIFRA_ICE = [];
      /* OPCIONAL: servidor próprio de salas (mais estável que a conexão direta). Depois de publicar o servidor no Render,
   cole aqui o endereço, por exemplo: window.DECIFRA_WS='wss://decifra-servidor.onrender.com'; Deixe vazio para usar a conexão direta (PeerJS). */
      window.DECIFRA_WS = '';
    </script>
    <script>
      /* PeerJS (conexão direta entre aparelhos) só é baixado quando não há servidor próprio de salas: com DECIFRA_WS definido ele não é usado */
      if (!String(window.DECIFRA_WS || '').trim())
        document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"><\/script>');
    </script>
    <script>
      /* Camada de rede independente do Claude: PeerJS (WebRTC) com o mesmo formato de "sala" do jogo.
   Quem registra o ID da sala vira o anfitrião; os demais conectam nele.
   Robustez: vários STUN + TURN de reserva, batimento cardíaco, reconexão automática, novas tentativas
   e TROCA AUTOMÁTICA DE ANFITRIÃO (migrate): se o anfitrião cair, um jogador assume em um novo ID (-g1, -g2...). */
      (function () {
        const WSU = ((window.DECIFRA_WS || '') + '').trim().replace(/\/$/, '');
        if (!WSU && typeof Peer === 'undefined') {
          window.claude = { use: async () => null };
          return;
        }
        const DEFAULT_ICE = [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun.cloudflare.com:3478' },
          { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
          { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
          {
            urls: 'turn:openrelay.metered.ca:443?transport=tcp',
            username: 'openrelayproject',
            credential: 'openrelayproject'
          }
        ];
        function getICE() {
          const base =
            window.DECIFRA_ICE && window.DECIFRA_ICE.length ? window.DECIFRA_ICE.slice() : DEFAULT_ICE.slice();
          try {
            const o = JSON.parse(localStorage.getItem('decifra.turn') || 'null');
            if (o && o.u && o.n && o.c) base.unshift({ urls: o.u, username: o.n, credential: o.c });
          } catch (e) {}
          return base;
        }
        const OPT = () => ({ config: { iceServers: getICE(), iceCandidatePoolSize: 4 }, debug: 0 });
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        function bus() {
          const h = {};
          return {
            on(t, f) {
              (h[t] = h[t] || []).push(f);
              return () => {
                h[t] = (h[t] || []).filter(x => x !== f);
              };
            },
            fire(t, m) {
              (h[t] || []).slice().forEach(f => {
                try {
                  f(m);
                } catch (e) {
                  console.error(e);
                }
              });
            }
          };
        }
        function build(core, base) {
          const b = bus(),
            pf = [],
            cf = [],
            sf = [];
          let c = core;
          const hooks = {
            ev: (t, m) => b.fire(t, m),
            peers: () =>
              pf.slice().forEach(f => {
                try {
                  f(c.peers());
                } catch (e) {}
              }),
            close: () =>
              cf.slice().forEach(f => {
                try {
                  f();
                } catch (e) {}
              }),
            status: s =>
              sf.slice().forEach(f => {
                try {
                  f(s);
                } catch (e) {}
              })
          };
          c.hooks = hooks;
          const room = {
            noFailover: true,
            base,
            on: (t, f) => b.on(t, f),
            emit: (t, d) => {
              try {
                c.emit(t, d);
              } catch (e) {
                return Promise.reject(Object.assign(new Error('emit'), { code: 'closed' }));
              }
              return Promise.resolve();
            },
            presence: p => {
              c.pres(p);
              return Promise.resolve();
            },
            peers: () => c.peers(),
            onPeers: f => {
              pf.push(f);
              return () => {
                const i = pf.indexOf(f);
                if (i >= 0) pf.splice(i, 1);
              };
            },
            onClose: f => {
              cf.push(f);
              return () => {};
            },
            onStatus: f => {
              sf.push(f);
              return () => {};
            },
            leave: () => {
              c.destroy();
              return Promise.resolve();
            },
            core: () => c,
            swap: n => {
              n.hooks = hooks;
              c = n;
            },
            migrate: (gen, delay) => (c.migrate ? c.migrate() : migrate(room, gen, delay))
          };
          return room;
        }
        function hostCore(peer) {
          const conns = new Map();
          let mp = {},
            timer = null;
          const core = {
            hooks: null,
            peer,
            peers: () =>
              [{ id: peer.id, presence: mp, isMe: true }].concat(
                [...conns].map(([id, c]) => ({ id, presence: c.p, isMe: false }))
              ),
            emit: (t, d) =>
              conns.forEach(c => {
                if (c.conn.open) c.conn.send({ t: 'ev', topic: t, data: d });
              }),
            pres: p => {
              mp = Object.assign({}, mp, p);
              notify();
            },
            destroy: () => {
              clearInterval(timer);
              try {
                peer.destroy();
              } catch (e) {}
            }
          };
          function notify() {
            const l = core.peers().map(p => ({ id: p.id, presence: p.presence }));
            conns.forEach(c => {
              if (c.conn.open) c.conn.send({ t: 'peers', list: l });
            });
            if (core.hooks) core.hooks.peers();
          }
          peer.on('connection', conn => {
            conn.on('open', () => {
              const old = conns.get(conn.peer);
              conns.set(conn.peer, { conn, p: old ? old.p : {}, rx: Date.now() });
              if (old && old.conn !== conn) {
                try {
                  old.conn.close();
                } catch (e) {}
              }
              notify();
            });
            conn.on('data', m => {
              const c = conns.get(conn.peer);
              if (c && c.conn === conn) c.rx = Date.now();
              if (!m) return;
              if (m.t === 'pr') {
                if (c) {
                  c.p = Object.assign({}, c.p, m.p);
                  notify();
                }
              } else if (m.t === 'ev' && core.hooks) core.hooks.ev(m.topic, { data: m.data, by: conn.peer });
            });
            const gone = () => {
              const c = conns.get(conn.peer);
              if (c && c.conn === conn) {
                conns.delete(conn.peer);
                notify();
              }
            };
            conn.on('close', gone);
            conn.on('error', gone);
          });
          peer.on('disconnected', () => {
            try {
              peer.reconnect();
            } catch (e) {}
          });
          peer.on('error', e => {
            if (e && ['network', 'server-error', 'socket-error', 'socket-closed'].includes(e.type)) {
              try {
                peer.reconnect();
              } catch (x) {}
            }
          });
          timer = setInterval(() => {
            const n = Date.now();
            conns.forEach((c, id) => {
              if (n - c.rx > 18000) {
                conns.delete(id);
                try {
                  c.conn.close();
                } catch (e) {}
                notify();
              } else if (c.conn.open) c.conn.send({ t: 'pg' });
            });
          }, 4000);
          return core;
        }
        function clientCore(peer, conn0, name) {
          let conn = conn0,
            list = [],
            mp = {},
            rx = Date.now(),
            dead = false,
            recon = false,
            tries = 0;
          const core = {
            hooks: null,
            peer,
            peers: () => list.map(p => ({ id: p.id, presence: p.presence, isMe: p.id === peer.id })),
            emit: (t, d) => {
              if (!conn || !conn.open) throw new Error('closed');
              conn.send({ t: 'ev', topic: t, data: d });
            },
            pres: p => {
              mp = Object.assign({}, mp, p);
              if (conn && conn.open) conn.send({ t: 'pr', p });
            },
            stop: () => {
              dead = true;
              clearInterval(hb);
            },
            destroy: () => {
              dead = true;
              clearInterval(hb);
              try {
                peer.destroy();
              } catch (e) {}
            }
          };
          function bind(c) {
            c.on('data', m => {
              rx = Date.now();
              if (!m) return;
              if (m.t === 'ev' && core.hooks) core.hooks.ev(m.topic, { data: m.data });
              else if (m.t === 'peers') {
                list = m.list || [];
                if (core.hooks) core.hooks.peers();
              }
            });
            c.on('close', () => {
              if (c === conn) lost();
            });
            c.on('error', () => {});
          }
          function lost() {
            if (dead || recon) return;
            recon = true;
            tries = 0;
            if (core.hooks) core.hooks.status('reconnecting');
            retry();
          }
          function retry() {
            if (dead) return;
            if (++tries > 3) {
              dead = true;
              clearInterval(hb);
              if (core.hooks) core.hooks.close();
              return;
            }
            try {
              if (peer.disconnected) peer.reconnect();
            } catch (e) {}
            let c;
            try {
              c = peer.connect(name, { reliable: true, serialization: 'json' });
            } catch (e) {
              return setTimeout(retry, 1500);
            }
            let ok = false;
            c.on('open', () => {
              if (dead) {
                try {
                  c.close();
                } catch (e) {}
                return;
              }
              ok = true;
              conn = c;
              recon = false;
              rx = Date.now();
              bind(c);
              try {
                c.send({ t: 'pr', p: mp });
              } catch (e) {}
              if (core.hooks) core.hooks.status('ok');
            });
            setTimeout(() => {
              if (!ok && !dead) {
                try {
                  c.close();
                } catch (e) {}
                retry();
              }
            }, 3000);
          }
          const hb = setInterval(() => {
            if (dead || recon) return;
            if (conn && conn.open) {
              try {
                conn.send({ t: 'pg' });
              } catch (e) {}
              if (Date.now() - rx > 16000) {
                const c = conn;
                conn = null;
                try {
                  c.close();
                } catch (e) {}
                lost();
              }
            } else lost();
          }, 4000);
          peer.on('disconnected', () => {
            try {
              peer.reconnect();
            } catch (e) {}
          });
          bind(conn);
          return core;
        }
        /* ---- troca de anfitrião ---- */
        function tryHost(hid) {
          return new Promise(res => {
            let done = false;
            const hp = new Peer(hid, OPT());
            const to = setTimeout(() => {
              if (!done) {
                done = true;
                try {
                  hp.destroy();
                } catch (e) {}
                res(null);
              }
            }, 8000);
            hp.on('open', () => {
              if (done) {
                try {
                  hp.destroy();
                } catch (e) {}
                return;
              }
              done = true;
              clearTimeout(to);
              res(hostCore(hp));
            });
            hp.on('error', e => {
              if (done) return;
              done = true;
              clearTimeout(to);
              try {
                hp.destroy();
              } catch (_) {}
              res(null);
            });
          });
        }
        function tryConnect(cp, hid) {
          return new Promise(res => {
            let done = false,
              conn;
            try {
              conn = cp.connect(hid, { reliable: true, serialization: 'json' });
            } catch (e) {
              return res(null);
            }
            const to = setTimeout(() => {
              if (!done) {
                done = true;
                try {
                  conn.close();
                } catch (e) {}
                res(null);
              }
            }, 4000);
            conn.on('open', () => {
              if (done) {
                try {
                  conn.close();
                } catch (e) {}
                return;
              }
              done = true;
              clearTimeout(to);
              res(clientCore(cp, conn, hid));
            });
          });
        }
        async function migrate(room, gen, delay) {
          const hid = room.base + '-g' + gen,
            t0 = Date.now(),
            old = room.core(),
            cp = old.peer;
          while (Date.now() - t0 < 50000) {
            if (Date.now() - t0 >= delay) {
              const h = await tryHost(hid);
              if (h) {
                room.swap(h);
                try {
                  old.destroy();
                } catch (e) {}
                return 'host';
              }
            }
            const cc = await tryConnect(cp, hid);
            if (cc) {
              try {
                old.stop && old.stop();
              } catch (e) {}
              room.swap(cc);
              return 'client';
            }
            await sleep(1200);
          }
          return 'fail';
        }
        /* ---- entrar / criar ---- */
        async function attempt(name) {
          return new Promise((res, rej) => {
            const to = setTimeout(() => rej(Object.assign(new Error('timeout'), { type: 'timeout' })), 20000);

        } else {
          eligible()
            .concat(S.pl.filter(p => p.el && p.id !== r.g && false))
            .forEach(p => {
              if (!solvedBy(p.id)) {
                p.st = 0;
                if (S.cfg.mode === 'surv' && !r.lost.includes(p.id)) {
                  p.L--;
                  if (p.L <= 0) p.el = 1;
                }
              }
            });
          if (r.g && r.sv.length) {
            const gp = 20 * r.sv.length + (r.sv[0].t < r.tot * 0.4 ? 30 : 0);
            pl(r.g).s += gp;
            r.gp = gp;
          }
          S.btw = NET.mode === 'local' ? 9000 : 8000;
        }
        bump();
      }
      function onGone(p) {
        if (!S || !['prep', 'round'].includes(S.phase)) return;
        if (S.r.g === p.id) {
          endRound('cancel');
          S.r.why = 'giver';
          return;
        }
        if (S.phase === 'round' && eligible().every(q => solvedBy(q.id))) endRound('all');
      }
      function tick(dt) {
        if (!S) return;
        const r = S.r;
        if (S.phase === 'prep' && NET.mode === 'online') {
          S.prep -= dt;
          if (S.prep <= 0) startRound();
        } else if (S.phase === 'round' && r.run && !S.pz) {
          r.rem -= dt;
          const ch = applyHints(1 - r.rem / r.tot);
          if (r.rem <= 0) {
            r.rem = 0;
            endRound('time');
          } else if (ch) bump();
        } else if (S.phase === 'between') {
          S.btw -= dt;
          if (S.btw <= 0) nextRound();
        }
        if (NET.mode === 'online' && NET.host) {
          const n = Date.now();
          S.pl.forEach(p => {
            if (p.on || p.id === S.host) return;
            S.lg[p.id] = S.lg[p.id] || n;
            if (S.phase === 'lobby' && n - S.lg[p.id] > 6000) {
              S.pl = S.pl.filter(q => q.id !== p.id);
              bump();
            }
          });
          if (!['lobby', 'final'].includes(S.phase)) {
            if (S.pl.filter(p => p.on && !p.sp).length < 2) {
              S.al += dt;
              if (S.al > 15000) {
                finish();
                bump();
              }
            } else S.al = 0;
          }
        }
      }
      function startLoop() {
        if (LOOP) clearInterval(LOOP);
        let hb = 0,
          last = performance.now();
        LOOP = setInterval(() => {
          const n = performance.now(),
            dt = n - last;
          last = n;
          tick(dt);
          hb += dt;
          if (hb >= 3000) {
            hb = 0;
            if (isOnline() && NET.host) push();
          }
        }, 200);
        wakeSync();
      }
      function stopLoop() {
        if (LOOP) clearInterval(LOOP);
        LOOP = null;
        wakeSync();
      }
      /* Tela ligada (Wake Lock): o jogo roda no navegador do anfitrião; se a tela dele apagar, a partida pausa ou cai.
   Só o anfitrião (quem tem o laço do jogo ativo) segura a tela; o bloqueio é refeito ao voltar para a aba. */
      let WAKE = null,
        WAKING = false;
      async function wakeOn() {
        if (WAKE || WAKING || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
        WAKING = true;
        try {
          const l = await navigator.wakeLock.request('screen');
          if (LOOP) {
            WAKE = l;
            l.addEventListener('release', () => {
              if (WAKE === l) WAKE = null;
            });
          } else l.release().catch(() => {});
        } catch (e) {}
        WAKING = false;
      }
      function wakeOff() {
        const l = WAKE;
        WAKE = null;
        if (l) l.release().catch(() => {});
      }
      function wakeSync() {
        LOOP ? wakeOn() : wakeOff();
      }
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') wakeSync();
      });
      /* sincronia de estado */
      function bump() {
        if (!S) return;
        S.rev++;
        after();
        if (isOnline() && NET.host) {
          push();
          secrets();
        }
      }
      function push() {
        const p = pub();
        while (JSON.stringify(p).length > 3700 && p.r && p.r.gs.length) p.r.gs.shift();
        NET.room.emit('state', p).catch(() => {});
      }
      function secrets() {
        const r = S.r;
        if (!r || !r.g || r.g === S.host || !['prep', 'round'].includes(S.phase)) return;
        NET.room
          .emit('secret', { to: r.g, n: r.n, w: enc(S.secret.word), b: S.secret.bank, q: S.secret.q })
          .catch(() => {});
      }
      function setT() {
        if (!S) return;
        let rem = 0,
          run = false;
        if (S.phase === 'round') {
          rem = S.r.rem;
          run = S.r.run && !S.pz;
        } else if (S.phase === 'prep') {
          rem = S.prep;
          run = NET.mode === 'online';
        } else if (S.phase === 'between') {
          rem = S.btw;
          run = true;
        }
        T = { rem, at: performance.now(), run };
      }
      function after() {
        const cur = pub();
        setT();
        const sig = JSON.stringify(cur, (k, v) =>
          k === 'rem' || k === 'prep' || k === 'btw' || k === 'rev' ? undefined : v
        );
        if (sig !== LASTSIG) {
          LASTSIG = sig;
          fxDiff(PREV, cur);
          render();
        }
        PREV = JSON.parse(JSON.stringify(cur));
      }
      function fxDiff(a, b) {
        if (!a || a.code !== b.code || !b.r) return;
        const me = NET.mode === 'local' ? null : ME.pid;
        if (b.n !== a.n && b.phase !== 'final') {
          KB = false;
          banner('Rodada ' + b.n, b.r.cat);
          sfx.nw();
        }
        const same = a.r && a.r.n === b.r.n;
        const ps = same ? a.r.sv.length : 0;
        b.r.sv.slice(ps).forEach(s => {
          PTS.push(s);
          const q = b.pl.find(x => x.id === s.p);
          if (s.p === me || NET.mode === 'local') {
            flash('ok');
            confetti(60);
            sfx.ok();
            banner('Acertou! +' + s.pts, q ? q.n : '', 'ok');
          } else {
            toast((q ? q.n : 'Alguém') + ' acertou! +' + s.pts, 'good');
            sfx.ok();
          }
        });
        const pg = same ? a.r.gs.length : 0;
        b.r.gs.slice(pg).forEach(g => {
          if (g.k === 'ok') return;
          if (g.p === me || NET.mode === 'local') {
            SHAKE = true;
            flash('no');
            sfx.no();
            toast(g.k === 'near' ? '🔥 Quase!' : 'Não é essa…', g.k === 'near' ? '' : 'bad');
          }
        });
        const lt0 = same ? (a.r.lt || []).length : 0;
        (b.r.lt || []).slice(lt0).forEach(q => {
          const has = [...b.r.pat].some(c => norm(c) === q.l),
            w = b.pl.find(x => x.id === q.p);
          toast(
            (w ? w.n + ' pediu a letra ' : 'Letra ') + q.l.toUpperCase() + ': ' + (has ? 'tem na palavra!' : 'não tem'),
            has ? 'good' : 'bad'
          );
          sfx.nw();
        });
        if (b.phase === 'between' && a.phase !== 'between' && !b.r.sv.length && b.r.why !== 'cancel')
          toast('Ninguém acertou a tempo!', 'bad');
        if (b.phase === 'between' && b.r.why === 'giver') toast('Quem dava as pistas saiu. Rodada cancelada.', 'bad');
        if (b.phase === 'final' && a.phase !== 'final') {
          confetti(160);
          sfx.win();
        }
        b.pl
          .filter(p => !a.pl.some(x => x.id === p.id))
          .forEach(p => toast(p.n + (p.sp ? ' entrou para assistir' : ' entrou na sala'), 'good'));
        b.pl.forEach(p => {
          const o = a.pl.find(x => x.id === p.id);
          if (o && o.on && !p.on) toast(p.n + ' saiu da partida');
          if (o && !o.on && p.on) toast(p.n + ' voltou!');
        });
      }
      /* ====== LOCAL: passar o aparelho ====== */
      function nextElig(from) {
        const r = S.r,
          L = S.pl.length;
        let i = S.pl.findIndex(p => p.id === from);
        for (let k = 1; k <= L; k++) {
          const c = S.pl[(i + k) % L];
          if (c.id !== r.g && !c.el && !solvedBy(c.id)) return c.id;
        }
        return null;
      }
      function localInit() {
        const r = S.r;
        const base = r.g || S.pl[(S.n - 1) % S.pl.length].id;
        LOC.cur = nextElig(base);
        LOC.pass = 1;
        S.pz = 1;
      }
      function localAdvance() {
        if (S.phase !== 'round') return;
        const prev = LOC.cur,
          n = nextElig(prev);
        if (!n) return;
        const left = eligible().filter(p => !solvedBy(p.id)).length;
        LOC.cur = n;
        if (left > 1) {
          LOC.pass = 1;
          S.pz = 1;
        } else {
          LOC.pass = 0;
          S.pz = 0;
        }
        render();
      }
      /* ====== REDE (sala online com anfitrião autoritativo) ====== */
      async function getRoom() {
        try {
          if (!window.claude || !window.claude.use) return null;
          return await window.claude.use('room');
        } catch (e) {
          return null;
        }
      }
      const genCode = () => {
        const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let s = '';
        for (let i = 0; i < 5; i++) s += c[Math.floor(Math.random() * c.length)];
        return s;
      };
      async function openRoom(code, g) {
        const R = await getRoom();
        if (!R) throw new Error('cap');
        return R.join('decifra-' + code.toLowerCase() + (g ? '-g' + g : ''));
      }
      function wire(room) {
        const u = NET.un;
        u.push(
          room.on('act', m => {
            if (NET.host && m.data && m.data.a) handle(m.data.pid, m.data.a);
          })
        );
        u.push(
          room.on('fx', m => {
            const d = m.data;
            if (d && RX.includes(d.e)) showReact(d.p, d.e);
          })
        );
        u.push(
          room.on('state', m => {
            if (!NET.host) recvState(m.data);
          })
        );
        u.push(
          room.on('secret', m => {
            const d = m.data;
            if (d && d.to === ME.pid) {
              try {
                NET.sec = { n: d.n, w: dec(d.w), b: d.b || [], q: d.q || [] };
                render();
              } catch (e) {}
            }
          })
        );
        u.push(
          room.on('msg', m => {
            const d = m.data;
            if (d && d.to === ME.pid) {
              toast(d.t, 'bad');
              if (d.f) leaveRoom(true);
            }
          })
        );
        u.push(room.onPeers(() => peersChanged()));
        if (room.onClose)
          u.push(
            room.onClose(() => {
              if (NET.room !== room) return;
              if (NET.host) {
                const cd = NET.code;
                toast('Você perdeu a conexão com a sala. Reentrando…', 'bad');
                leaveRoom(true);
                joinRoom(cd, true);
              } else doMigrate(room);
            })
          );
        if (room.onStatus)
          u.push(
            room.onStatus(st => {
              if (st === 'reconnecting') toast('Reconectando…');
              if (st === 'ok') {
                toast('Reconectado!', 'good');
                hello();
              }
            })
          );
      }
      function recvState(s) {
        if (!s || s.code !== NET.code) return;
        if (S && s.host === S.host && s.rev < S.rev) return;
        S = s;
        NET.hostSeen = Date.now();
        V = 'game';
        after();
      }
      function peersChanged() {
        const room = NET.room;
        if (!room || !S) return;
        const peers = room.peers();
        const ids = new Set(peers.map(p => p.presence && p.presence.pid).filter(Boolean));
        if (NET.host) {
          let ch = false;
          S.pl.forEach(p => {
            if (p.id === S.host) return;
            const on = ids.has(p.id) ? 1 : 0;
            if (on !== p.on) {
              p.on = on;
              ch = true;
              if (!on) {
                S.lg[p.id] = Date.now();
                onGone(p);
              } else delete S.lg[p.id];
            }
          });
          if (ch) bump();
        } else if (peers.some(p => !p.isMe && p.presence && p.presence.h === 1)) NET.hostSeen = Date.now();
      }
      function hello() {
        if (NET.room)
          NET.room.emit('act', { pid: ME.pid, a: { type: 'hello', n: ME.name, av: ME.av } }).catch(e => {
            if (e && e.code === 'not_granted') {
              NET.denied = 1;
            }
          });
      }
      async function doMigrate(room) {
        if (NET.migrating || !S) return;
        NET.migrating = 1;
        NET.gen = (NET.gen || 0) + 1;
        toast('O anfitrião saiu. Escolhendo um novo…');
        const cands = S.pl
          .filter(p => p.on && p.id !== S.host)
          .map(p => p.id)
          .sort();
        let rank = cands.indexOf(ME.pid);
        if (rank < 0) rank = cands.length;
        let r = 'fail';
        try {
          r = await room.migrate(NET.gen, rank * 7000);
        } catch (e) {}
        NET.migrating = 0;
        if (NET.room !== room) return;
        if (r === 'host') promote();
        else if (r === 'client') {
          NET.hostSeen = Date.now();
          try {
            await room.presence({ pid: ME.pid, nm: ME.name, av: ME.av, h: 0 });
          } catch (e) {}
          hello();
          toast('Novo anfitrião conectado', 'good');
        } else {
          leaveRoom(true);
          toast('Não foi possível continuar a partida.', 'bad');
        }
      }
      function promote() {
        const ids = new Set(
          NET.room
            .peers()
            .map(p => p.presence && p.presence.pid)
            .filter(Boolean)
        );
        NET.host = true;
        NET.me = ME.pid;
        S.host = ME.pid;
        S.rev += 100;
        S.used = [];
        S.lg = {};
        S.al = 0;
        S.secret = { word: '—', bank: [], q: [], qn: 0 };
        S.pl.forEach(p => {
          if (!ids.has(p.id)) p.on = 0;
        });
        NET.room.presence({ pid: ME.pid, nm: ME.name, av: ME.av, h: 1 }).catch(() => {});
        S.custom = [];
        if (CWTXT.trim()) setCW(CWTXT.split('\n'));
        else if (S.cfg.cw) {
          S.cfg.cw = 0;
          const k = S.cfg.cats.indexOf('turma');
          if (k >= 0 && S.cfg.cats.length > 1) S.cfg.cats.splice(k, 1);
        }
        const me = pl(ME.pid);
        if (me) {
          me.rd = 1;
          me.on = 1;

        startLoop();
        if (['prep', 'round'].includes(S.phase)) {

      }
      setInterval(() => {
        // failover do anfitrião
        if (!isOnline() || NET.host || !S || !NET.room || NET.room.noFailover) return;
        if (Date.now() - NET.hostSeen < 9000) return;
        const ids = new Set(
          NET.room
            .peers()
            .map(p => p.presence && p.presence.pid)
            .filter(Boolean)
        );
        const c = S.pl
          .filter(p => p.id !== S.host && ids.has(p.id))
          .map(p => p.id)
          .sort()[0];
        if (c === ME.pid) promote();
        else NET.hostSeen = Date.now();
      }, 1500);
      async function createRoom() {
        if (!ME.name.trim()) return toast('Digite seu nome primeiro', 'bad');
        HUB.busy = 'Criando sala…';
        render();
        for (let i = 0; i < 4; i++) {
          const code = genCode();
          let room;
          try {
            room = await openRoom(code);
            await room.presence({ pid: ME.pid, nm: ME.name, av: ME.av, h: 0 });
          } catch (e) {

      /* ====== TELAS ====== */
      const av = (p, c = '') => `<span class="av ${c}" style="--c:${COLORS[p.c % 8]}">${p.a}</span>`;

 <div class="cfg-sec"><div>Modo de jogo</div><div class="row">${Object.keys(MODES)

          area =
            '<div class="card big-msg"><h3>👀 Você está assistindo</h3><p class="mut">Você entra como jogador na próxima partida.</p></div>';
        else if (!local && !mp) area = '<div class="card big-msg"><p class="mut">Você está assistindo.</p></div>';
        else
          area = `<div class="card">${local && mp ? `<div class="row" style="margin-bottom:10px">${av(mp)}<h3 style="margin:0">Vez de ${esc(mp.n)}</h3></div>` : ''}
  ${hintBlock(actor)}<form data-form="guess" class="gform"><input id="gi" autocomplete="off" autocapitalize="characters" placeholder="Qual é a palavra?" maxlength="40"><button class="btn tang" type="submit">Enviar</button></form>
  ${local ? '<div style="height:8px"></div><button class="btn ghost sm" data-a="skip" type="button">Passar a vez</button>' : ''}</div>`;
        const feed = r.gs.length
          ? `<div class="card"><h3>Palpites</h3><div class="feed">${[...r.gs]
              .reverse()
              .map(g => {
                const q = pl(g.p);
                return `<div class="g ${g.k}">${q ? av(q, 'sm') : ''}<b>${q ? esc(q.n) : ''}</b>${g.k === 'ok' ? '<span>acertou! 🎉</span>' : `<span class="x1">${esc(g.x)}</span>${g.k === 'near' ? '<span>🔥 quase!</span>' : ''}`}</div>`;
              })
              .join('')}</div></div>`
          : '';
        return (
          `<div class="wrap"><div class="gm"><div>${head()}
 <div class="timer"><div id="tm" class="tm">0</div><div class="tbar"><i id="bar"></i></div>${r.rush ? '<p class="disp" style="color:var(--tang)">⏰ Alguém acertou! Corra!</p>' : ''}</div>
 <div class="card stage"><span class="chip cat">${r.cat}</span> <span class="chip">${letters} letras</span> <span class="chip" title="Nível da palavra">${'★'.repeat(r.wd || 1)}${'☆'.repeat(3 - (r.wd || 1))}</span>${tiles(r.pat)}${missHtml(r)}
 ${r.cl.length ? `<ul class="clues">${r.cl.map((c, i) => `<li><b>${i + 1}</b>${esc(c)}</li>`).join('')}</ul>` : `<p class="mut">${MODES[S.cfg.mode].g ? 'Esperando a primeira pista…' : 'As pistas chegam com o tempo.'}</p>`}</div>
 ${area}${feed}</div><aside><div class="card"><h3>Placar</h3>${boardHtml()}</div>${reactBar()}</aside></div></div>` +
          (local && LOC.pass && mp ? passHtml(mp, 'Vez de', 'Estou pronto!', 'passgo') : '')
        );
      }
      function vBetween() {
        const r = S.r,
          local = NET.mode === 'local',
          canNext = local || NET.host,
          over = S.n > 0 && gameOver();
        const why =
          {
            time: '⏱️ Tempo esgotado!',
            all: '🎉 Todos acertaram!',
            cancel: 'Rodada cancelada',
            giver: 'Rodada cancelada'
          }[r.why] || '';
        const miss = eligible().filter(p => !solvedBy(p.id));
        return `<div class="wrap narrow">${head()}<div class="card stage"><h3>${why}</h3><p class="mut">A palavra era</p>${tiles(r.w || '—', true)}</div>
 <div class="card"><h3>Resultado da rodada</h3><div class="res">
 ${r.sv
   .map((s, i) => {
     const p = pl(s.p);
     return `<div class="it">${['🥇', '🥈', '🥉'][i] || '✅'} ${av(p, 'sm')}<span>${esc(p.n)} <span class="mut">(${(s.t / 1000).toFixed(1)}s)</span></span><b>+${s.pts}</b></div>`;
   })
   .join('')}
 ${r.g && r.gp ? `<div class="it">🎤 ${av(pl(r.g), 'sm')}<span>${esc(pl(r.g).n)} (pistas)</span><b>+${r.gp}</b></div>` : ''}
 ${miss.map(p => `<div class="it">❌ ${av(p, 'sm')}<span>${esc(p.n)} não acertou</span>${S.cfg.mode === 'surv' ? `<b style="color:var(--bad)">${p.el ? '💀' : '−1 ❤️'}</b>` : ''}</div>`).join('')}</div></div>
 <div class="card"><h3>Placar</h3>${boardHtml()}</div>${reactBar()}
 ${canNext ? `<button class="btn tang big" data-a="next">${over ? 'Ver resultado final' : 'Próxima rodada'} (<span id="cd">8</span>)</button>` : `<p class="mut" style="text-align:center">${over ? 'Resultado final em' : 'Próxima rodada em'} <b id="cd">8</b>s…</p>`}</div>`;
      }
      function vFinal() {
        const surv = S.cfg.mode === 'surv',
          teams = S.cfg.mode === 'teams',
          host = NET.mode === 'local' || NET.host;
        const rk = [...S.pl.filter(p => !p.sp)].sort((a, b) =>
          surv ? a.el - b.el || b.s - a.s : b.s - a.s || b.h - a.h
        );
        let win = rk[0].n + ' venceu!';
        if (teams) {
          const t = [0, 1].map(i => S.pl.filter(p => p.t === i).reduce((s, p) => s + p.s, 0));
          win =
            t[0] === t[1]
              ? 'Empate entre as equipes!'
              : `Equipe ${t[0] > t[1] ? 'Laranja' : 'Azul'} venceu! (${Math.max(...t)} a ${Math.min(...t)})`;
        }
        const pod = [
          [rk[1], 'p2', '🥈'],
          [rk[0], 'p1', '🥇'],
          [rk[2], 'p3', '🥉']
        ].filter(x => x[0]);
        const most = [...S.pl].sort((a, b) => b.h - a.h)[0],
          bs = [...S.pl].sort((a, b) => b.bs - a.bs)[0],
          bt = S.pl.filter(p => p.bt > 0).sort((a, b) => a.bt - b.bt)[0];
        return `<div class="wrap narrow"><div class="big-msg"><div class="trophy">🏆</div><h2>${esc(win)}</h2></div>
 <div class="podium">${pod.map(([p, c, m]) => `<div class="pc ${c}">${av(p, 'lg')}<div class="nm">${esc(p.n)}</div><div class="step">${m}</div><b class="disp">${p.s} pts</b></div>`).join('')}</div>
 <div class="hl"><div>🎯 Total de acertos<big>${most && most.h ? most.h : 0}</big>${most && most.h ? esc(most.n) : '—'}</div><div>⚡ Maior sequência<big>${bs && bs.bs ? bs.bs : 0}</big>${bs && bs.bs ? esc(bs.n) : '—'}</div><div>⏱️ Melhor tempo<big>${bt ? (bt.bt / 1000).toFixed(1) + 's' : '—'}</big>${bt ? esc(bt.n) : '—'}</div></div>
 <div class="card"><h3>📊 Pontuação de todos</h3><div style="overflow-x:auto"><table><tr><th></th><th>Jogador</th><th>Pontos</th><th>🎯</th><th>⚡</th><th>⏱️</th></tr>${rk.map((p, i) => `<tr><td>${['🥇', '🥈', '🥉'][i] || i + 1}</td><td>${p.a} ${esc(p.n)}</td><td><b>${p.s}</b></td><td>${p.h}</td><td>${p.bs}</td><td>${p.bt ? (p.bt / 1000).toFixed(1) + 's' : '—'}</td></tr>`).join('')}</table></div></div>
 ${
   S.pl.some(p => p.w > 0)
     ? `<div class="card"><h3>🏆 Vitórias na sala</h3><div class="row">${[...S.pl]
         .filter(p => !p.sp || p.w)
         .sort((a, b) => (b.w || 0) - (a.w || 0))
         .map(p => `<span class="chip">${p.a} ${esc(p.n)} · <b>${p.w || 0}</b></span>`)
         .join('')}</div></div>`
     : ''
 }
 <div class="menu" style="max-width:none">${host ? '<button class="btn tang big" data-a="again">Jogar novamente</button><button class="btn teal big" data-a="newgame">Nova partida</button>' : '<p class="mut" style="text-align:center">Aguardando o anfitrião decidir o que vem agora…</p>'}<button class="btn ghost big" data-a="menu2">Voltar ao menu</button></div></div>`;
      }
      function view() {
        if (V === 'game' && S) {
          const p = S.phase;
          if (p === 'lobby') return isOnline() ? vLobby() : '';
          if (p === 'prep') return vPrep();
          if (p === 'round') return vRound();
          if (p === 'between') return vBetween();
          return vFinal();
        }
        return ({ home: vHome, how: vHow, set: vSet, hub: vHub }[V] || vHome)();
      }
      function modalHtml() {
        const on = isOnline();
        return `<div class="modal"><div class="card"><h3>${on ? 'Sair da sala?' : 'Encerrar a partida?'}</h3><p class="mut">${on && NET.host ? 'Outro jogador vai assumir como anfitrião.' : 'Seu progresso nesta partida será perdido.'}</p><div class="row" style="justify-content:center;margin-top:12px"><button class="btn ghost" data-a="no">Continuar jogando</button><button class="btn rose" data-a="yes">Sair</button></div></div></div>`;
      }
      function render() {
        const app = $('#app'),
          ae = document.activeElement,
          keep =
            ae && ae.id && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA') ? { id: ae.id, v: ae.value } : null;
        let h;
        try {
          h = view();
        } catch (e) {
          console.error(e);
          h =
            '<div class="wrap"><p>Ops, algo deu errado ao desenhar a tela.</p><button class="btn" data-a="menu2">Voltar ao menu</button></div>';
        }
        app.innerHTML = h + (MODAL ? modalHtml() : '');
        if (keep) {
          const n = document.getElementById(keep.id);
          if (n) {
            n.value = keep.v;
            try {
              n.focus();
            } catch (e) {}
          }
        }
        if (SHAKE) {
          SHAKE = false;
          const f = $('.gform');
          if (f) f.classList.add('shake');
        }
        PTS.splice(0).forEach(s => {
          const li = document.querySelector(`[data-pid="${s.p}"]`);
          if (li) {
            const b = document.createElement('b');
            b.className = 'pt';
            b.textContent = '+' + s.pts;
            li.appendChild(b);
          }
        });
        updTimer();
      }
      function updTimer() {
        if (!S) return;
        const r = curRem(),
          s = Math.ceil(r / 1000),
          tm = $('#tm');
        if (tm) {
          tm.textContent = fmt(s);
          tm.classList.toggle('low', S.phase === 'round' && s <= 10 && T.run);
          const b = $('#bar');
          if (b && S.r) b.style.width = Math.min(100, (100 * r) / S.r.tot) + '%';
          if (S.phase === 'round' && T.run && s <= 5 && s > 0 && s !== LASTS) sfx.tick();
          LASTS = s;
        }
        const cd = $('#cd');
        if (cd) cd.textContent = s;
      }
      setInterval(updTimer, 120);
      /* ====== AÇÕES ====== */
      function lstart() {
        const L = LOC;
        if (L.cfg.mode === 'teams') {
          const a = L.players.filter(p => p.t === 0).length,
            b = L.players.length - a;
          if (!a || !b || a > 4 || b > 4) return toast('Monte duas equipes com 1 a 4 jogadores cada.', 'bad');
        }
        NET = { mode: 'local', host: true, room: null, code: 'LOCAL', un: [] };
        S = newState('LOCAL', 'L');
        S.cfg = JSON.parse(JSON.stringify(L.cfg));
        S.pl = L.players.map((p, i) => {
          const q = mkPlayer('p' + (i + 1), (p.n || '').trim() || 'Jogador ' + (i + 1), p.a);
          q.c = i;
          q.t = p.t || 0;
          return q;
        });
        V = 'game';
        LASTSIG = '';
        PREV = null;
        startLoop();
        startGame();
      }
      const A = {
        nav(d) {
          V = d.to;
          window.scrollTo(0, 0);
          render();
        },
        hub(d) {
          V = 'hub';
          HUB.tab = d.tab || null;
          window.scrollTo(0, 0);
          HUB.cap = null;
          HUB.net = null;
          render();
          if (window.claude && claude.probe)
            claude.probe().then(ok => {
              HUB.net = ok ? 'ok' : 'bad';
              if (V === 'hub') render();
            });
          else HUB.net = 'bad';
          getRoom().then(r => {
            HUB.cap = r ? 'ok' : 'no';
            if (V === 'hub') render();
          });
        },
        tab(d) {
          HUB.tab = d.v;
          render();
        },
        mav(d) {
          ME.av = d.v;
          saveProf();
          render();
        },
        create() {
          createRoom();
        },
        join() {
          joinRoom(HUB.code);
        },
        cfg(d) {
          const k = d.k;
          let v = d.v;
          if (k !== 'mode' && k !== 'cat') v = +v;
          if (V === 'lsetup') {
            const c = LOC.cfg;
            if (k === 'cat') {
              const i = c.cats.indexOf(v);
              if (i >= 0) {
                if (c.cats.length > 1) c.cats.splice(i, 1);
              } else c.cats.push(v);
            } else {
              c[k] = v;
              if (k === 'mode' && v === 'teams') LOC.players.forEach((p, i) => (p.t = i % 2));
            }
            render();
          } else act({ type: 'cfg', k, v });
        },
        lav(d) {
          const p = LOC.players[+d.i];
          p.a = AVS[(AVS.indexOf(p.a) + 1) % AVS.length];
          render();
        },
        ladd() {
          if (LOC.players.length < 8) {
            LOC.players.push({ n: '', a: AVS[LOC.players.length % AVS.length], t: LOC.players.length % 2 });
            render();
          }
        },
        ldel(d) {
          LOC.players.splice(+d.i, 1);
          render();
        },
        lteam(d) {
          const p = LOC.players[+d.i];
          p.t = p.t ? 0 : 1;
          render();
        },
        lstart,
        copy() {
          const t = S.code;
          const ok = () => toast('Código copiado!', 'good');
          try {
            navigator.clipboard.writeText(t).then(ok, () => toast('Código: ' + t));
          } catch (e) {
            toast('Código: ' + t);
          }
        },
        ready() {
          act({ type: 'ready' });
        },
        team(d) {
          act({ type: 'team', t: +d.t });
        },
        start() {
          act({ type: 'start' });
        },
        ask(d) {
          MODAL = { q: d.q };
          render();
        },
        no() {
          MODAL = null;
          render();
        },
        yes() {
          MODAL = null;
          stopLoop();
          leaveRoom();
        },
        menu2() {
          leaveRoom();
        },
        addclue() {
          const i = $('#ci');
          if (!i) return;
          const x = i.value;
          i.value = '';
          act({ type: 'clue', x });
          const n = $('#ci');
          if (n) n.focus();
        },
        unclue() {
          act({ type: 'unclue' });
        },
        emo(d) {
          const i = $('#ci');
          if (i) {
            i.value += d.v;
            i.focus();
          }
        },
        sug(d) {
          const s = mySecret(),
            i = $('#ci');
          if (s && i) {
            i.value = s.b[+d.i] || '';
            i.focus();
          }
        },
        go() {
          act({ type: 'go' });
        },
        grgo() {
          LOC.gr = 1;
          render();
        },
        passgo() {
          LOC.pass = 0;
          S.pz = 0;
          setT();
          render();
        },
        skip() {
          localAdvance();
        },
        rx(d) {
          act({ type: 'react', x: d.v });
        },
        swap() {
          act({ type: 'swap' });
        },
        cwsave() {
          act({ type: 'cw', list: CWTXT.split('\n') });
          toast('Palavras salvas!', 'good');
        },
        invite() {
          const u = inviteUrl(),
            t = 'Vem jogar Decifra! Código da sala: ' + S.code;
          if (navigator.share) {
            navigator.share({ title: 'Decifra!', text: t, url: u }).catch(() => {});
          } else {
            try {
              navigator.clipboard.writeText(t + '\n' + u).then(
                () => toast('Convite copiado!', 'good'),
                () => toast(u)
              );
            } catch (e) {
              toast(u);
            }
          }
        },
        invwa() {
          /* abre o WhatsApp (app no celular, WhatsApp Web no computador) já com o convite escrito */
          const t = 'Vem jogar Decifra! Código da sala: ' + S.code + '\n' + inviteUrl();
          window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank', 'noopener');
        },
        kb() {
          KB = !KB;
          render();
        },
        pick(d) {
          KB = false;
          act({ type: 'letter', x: d.v });
        },
        next() {
          act({ type: 'next' });
        },
        again() {
          act({ type: 'again' });
        },
        newgame() {
          if (NET.mode === 'local') {
            stopLoop();
            S = null;
            NET = { mode: 'none', host: false, room: null, code: '', sec: null, un: [], hostSeen: 0 };
            V = 'lsetup';
            LASTSIG = '';
            render();
          } else act({ type: 'newgame' });
        },
        theme(d) {
          SET.theme = d.v;
          saveSet();
          render();
        },
        snd() {
          SET.sound = !SET.sound;
          saveSet();
          render();
        },
        anim() {
          SET.anim = !SET.anim;
          saveSet();
          render();
        },
        install() {
          if (!INSTALL) return;
          const p = INSTALL;
          INSTALL = null;
          try {
            p.prompt();
            p.userChoice.catch(() => {});
          } catch (e) {}
          render();
        }
      };
      const F = {
        guess(f) {
          const i = f.querySelector('input'),
            x = i.value;
          if (!x.trim()) return;
          i.value = '';
          if (NET.mode === 'local') {
            handle(LOC.cur, { type: 'guess', x });
            localAdvance();
          } else act({ type: 'guess', x });
        }
      };
      document.addEventListener('click', e => {
        const b = e.target.closest('[data-a]');
        if (!b || b.disabled) return;
        const f = A[b.dataset.a];
        if (f) f(b.dataset, b);
      });
      document.addEventListener('submit', e => {
        const f = e.target.closest('[data-form]');
        if (!f) return;
        e.preventDefault();
        F[f.dataset.form](f);
      });
      document.addEventListener('input', e => {
        const t = e.target,
          k = t.dataset && t.dataset.in;
        if (k === 'ln') LOC.players[+t.dataset.i].n = t.value;
        else if (k === 'name') {
          ME.name = t.value.slice(0, 12);
          saveProf();
        } else if (k === 'code') {
          HUB.code = t.value.toUpperCase();
        } else if (k === 'cw') {
          CWTXT = t.value;
          store.set('decifra.cw', CWTXT);
        } else if (k === 'turn') {
          const o = store.get('decifra.turn') || {};
          o[t.dataset.k] = t.value.trim();
          store.set('decifra.turn', o);
        }
      });
      /* ====== INÍCIO ====== */
      addEventListener('pagehide', e => {
        if (!e.persisted && NET.room) {
          try {
            NET.room.leave();
          } catch (x) {}
        }
      });
      if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol))
        addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        });
      applyTheme();
      const sess = store.sget('decifra.sess');
      let inv = '';
      try {
        inv = (new URLSearchParams(location.search).get('sala') || '')
          .toUpperCase()
          .replace(/[^A-Z0-9]/g, '')
          .slice(0, 6);
      } catch (e) {}
      if (inv && !(sess && sess.code)) {
        A.hub({ tab: 'join' });
        HUB.code = inv;
        HUB.inv = 1;
      }
      render();
      if (sess && sess.code && ME.name) {
        V = 'hub';
        HUB.tab = 'join';
        HUB.busy = 'Reconectando…';
        render();
        joinRoom(sess.code, true);
      }
    </script>
  </body>
</html>
